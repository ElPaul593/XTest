# Render Blueprint (Infrastructure as Code) para el BACKEND con Node.js.
# En Render: New + -> Blueprint -> conecta este repo. Render detecta este archivo.
# Luego completa los valores secretos (sync:false) en el panel.

services:
  - type: web
    name: culturaltrip-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    # GitHub Actions ejecuta lint, pruebas y build antes de disparar el deploy.
    # Esto evita que Render despliegue directamente cada push sin pasar CI.
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      # Secretos: se cargan manualmente en el panel de Render (no se versionan).
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: EXTERNAL_API_URL
        sync: false
      - key: SEAT_API_ADMIN_TOKEN
        sync: false
