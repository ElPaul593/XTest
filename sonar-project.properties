# Cultural Trip / XTest — SonarQube Cloud
# El projectKey y organization se configuran en GitHub Actions como variables,
# despues de importar XTest en SonarQube Cloud (no se inventan identificadores).
sonar.projectName=Cultural Trip - XTest
sonar.sourceEncoding=UTF-8
sonar.sources=backend/src,frontend/src
sonar.tests=backend/src/__tests__
sonar.test.inclusions=backend/src/__tests__/**/*.test.js
sonar.exclusions=backend/src/__tests__/**,**/node_modules/**,**/coverage/**,**/dist/**,**/test-results/**,**/playwright-report/**
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
