name: CI/CD CulturalTrip

on:
  push:
    branches: [main, main_paul, master]
  pull_request:
    branches: [main, main_paul, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: culturaltrip-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint, tests and SonarQube quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test:coverage -- --runInBand --coverageReporters=lcov --coverageReporters=text-summary
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret

      - name: Confirm LCOV report exists
        working-directory: .
        run: test -s backend/coverage/lcov.info

      - name: Save coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xtest-backend-coverage
          path: backend/coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Validate SonarQube configuration
        working-directory: .
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_PROJECT_KEY" ] || [ -z "$SONAR_ORGANIZATION" ]; then
            echo "::error::Configure SONAR_TOKEN, SONAR_PROJECT_KEY and SONAR_ORGANIZATION before running this required quality gate."
            exit 1
          fi

      - name: SonarQube Cloud scan with quality gate
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5000/api
          VITE_SEAT_API_URL: http://localhost:5000/api/asientos

  deploy-render:
    name: Deploy backend to Render
    needs: [backend, frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/main_paul' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Missing required GitHub secret: RENDER_DEPLOY_HOOK_URL"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
