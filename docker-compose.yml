# Orquestacion local de todo el proyecto con un solo comando:
#   docker compose up --build
#
# - backend:  API en http://localhost:5000  (usa backend/.env -> MongoDB Atlas)
# - frontend: SPA  en http://localhost:3000  (nginx, llama al backend en :5000)
#
# Requisito: tener creado backend/.env con MONGO_URI y JWT_SECRET.

services:
  backend:
    build: ./backend
    container_name: culturaltrip-backend
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # El bundle del front se hornea apuntando al backend local.
        VITE_API_URL: "http://localhost:5000/api"
        VITE_SEAT_API_URL: "http://localhost:5000/api/asientos"
    container_name: culturaltrip-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
